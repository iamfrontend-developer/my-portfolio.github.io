<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Practice Lab | Mahesh Sutar</title>
<script src="theme-init.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="practice">
<div id="site-nav"></div>

<div class="wrap page-head fade">
  <div class="eyebrow">Practice</div>
  <h1>React Practice Lab</h1>
  <p class="muted">Live components with their source code. Add your own in <code>practice-data.js</code>, or try code instantly in the playground below.</p>
</div>

<section style="padding-top:30px"><div class="wrap">
  <div class="grid2" id="root"></div>
</div></section>

<div id="site-footer"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="practice-data.js"></script>
<script src="site.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// Turn a code string (that defines `function Demo`) into a real component.
function compile(code) {
  const js = Babel.transform(code, { presets: ["react"] }).code;
  const fn = new Function("React", "useState", "useEffect", "useRef", "useMemo", "useCallback",
    js + "\n;return typeof Demo !== 'undefined' ? Demo : null;");
  return fn(React, useState, useEffect, useRef, useMemo, useCallback);
}

class Boundary extends React.Component {
  state = { err: null };
  static getDerivedStateFromError(err) { return { err }; }
  render() { return this.state.err ? <pre className="err">{String(this.state.err.message)}</pre> : this.props.children; }
}

function Live({ code }) {
  const res = useMemo(() => {
    try { return { C: compile(code) }; } catch (e) { return { err: e.message }; }
  }, [code]);
  if (res.err) return <pre className="err">{res.err}</pre>;
  if (!res.C) return <pre className="err">Define a function named Demo.</pre>;
  return <Boundary key={code}><res.C /></Boundary>;
}

function Card({ item, done, toggleDone, onEdit }) {
  const [tab, setTab] = useState("preview");
  return (
    <div className="card">
      <div className="card-top">
        <div>
          <h3>{item.title}</h3>
          <div className="chips" style={{ marginTop: 8 }}>{item.concepts.map(c => <span className="chip" key={c}>{c}</span>)}</div>
        </div>
        <label><input type="checkbox" checked={done} onChange={toggleDone} /> Practiced</label>
      </div>
      <div className="tabs">
        <button className={tab === "preview" ? "on" : ""} onClick={() => setTab("preview")}>Preview</button>
        <button className={tab === "code" ? "on" : ""} onClick={() => setTab("code")}>Code</button>
        <button onClick={() => onEdit(item.code)}>Edit in playground</button>
      </div>
      {tab === "preview" ? <div className="preview"><Live code={item.code} /></div> : <pre>{item.code}</pre>}
    </div>
  );
}

const STARTER = PRACTICE[0].code;

function App() {
  const [done, setDone] = useState(() => { try { return JSON.parse(localStorage.getItem("ms_practiced")) || {}; } catch (e) { return {}; } });
  const [code, setCode] = useState(STARTER);
  const playRef = useRef(null);
  const toggle = id => {
    const next = { ...done, [id]: !done[id] };
    setDone(next);
    try { localStorage.setItem("ms_practiced", JSON.stringify(next)); } catch (e) {}
  };
  const count = PRACTICE.filter(p => done[p.id]).length;
  const edit = c => { setCode(c); playRef.current && playRef.current.scrollIntoView({ behavior: "smooth" }); };

  return (
    <>
      <p className="muted" style={{ gridColumn: "1/-1" }}>
        Progress: <b>{count}</b> of {PRACTICE.length} practiced
      </p>
      {PRACTICE.map(p => <Card key={p.id} item={p} done={!!done[p.id]} toggleDone={() => toggle(p.id)} onEdit={edit} />)}
      <div ref={playRef} style={{ gridColumn: "1/-1", marginTop: 30 }}>
        <div className="eyebrow">Playground</div>
        <h2>Try your own component</h2>
        <div className="split">
          <textarea className="editor" spellCheck="false" value={code} onChange={e => setCode(e.target.value)} />
          <div className="preview"><Live code={code} /></div>
        </div>
        <div className="btns"><button className="btn" onClick={() => setCode(STARTER)}>Reset</button>
          <button className="btn" onClick={() => navigator.clipboard && navigator.clipboard.writeText(code)}>Copy code</button></div>
        <p className="muted" style={{ fontSize: ".85rem", marginTop: 10 }}>Happy with it? Paste it into <code>practice-data.js</code> to keep it on the page.</p>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
