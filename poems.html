<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poems | Mahesh Sutar</title>
<script src="theme-init.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="poems">
<div id="site-nav"></div>

<div class="wrap page-head fade">
  <div class="eyebrow">Poems</div>
  <h1>Verses on code, craft &amp; Sahyadri</h1>
  <p class="muted">Short poems in English and Marathi. A new one is featured each day.</p>
</div>

<section style="padding-top:30px">
  <div class="wrap"><div class="card today poem" id="today"></div></div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="eyebrow">All poems</div><h2>The collection</h2>
    <div class="filters" id="filters" role="group" aria-label="Filter poems"></div>
    <div class="poem-grid" id="list"></div>
    <p class="muted" style="font-size:.85rem;margin-top:22px">To add your own poem, put it at the top of the list in <code>poems.js</code>.</p>
  </div>
</section>

<div id="site-footer"></div>

<script src="poems.js"></script>
<script src="site.js"></script>
<script>
  document.getElementById("today").innerHTML = poemCard(poemOfTheDay(), { tag: "Poem of the day" });

  var list = document.getElementById("list");
  list.innerHTML = POEMS.map(function (p) { return '<article class="card poem" data-lang="' + p.lang + '">' + poemCard(p) + "</article>"; }).join("");

  var n = function (l) { return l === "all" ? POEMS.length : POEMS.filter(function (p) { return p.lang === l; }).length; };
  var f = document.getElementById("filters");
  f.innerHTML = [["all","All"],["en","English"],["mr","मराठी"]].map(function (x, i) {
    return '<button type="button" data-f="' + x[0] + '" class="' + (i === 0 ? "on" : "") + '">' + x[1] + " (" + n(x[0]) + ")</button>";
  }).join("");
  f.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    f.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x === b); });
    list.querySelectorAll(".poem").forEach(function (c) { c.classList.toggle("hidden", b.dataset.f !== "all" && c.dataset.lang !== b.dataset.f); });
  });
</script>
</body>
</html>
